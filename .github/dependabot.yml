version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Keep tightly coupled packages moving together.
      three:
        patterns: ["three", "@types/three", "@react-three/*"]
      next:
        patterns:
          ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      tooling:
        patterns:
          ["eslint", "prettier", "typescript", "tailwindcss", "@tailwindcss/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
